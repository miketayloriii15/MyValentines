<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Be My Valentine? ❤️</title>

    <!-- CSS File Link -->
    <link rel="stylesheet" href="styles.css" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Google Font -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Roboto:wght@300;400;700&display=swap"
      rel="stylesheet"
    />

    <!-- FontAwesome -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css"
    />
  </head>

  <body>
    <!-- Contact Section -->
    <div class="container text-center mt-5">
      <h1 class="text-danger fw-bold">Do you want to be my Valentine? 💌</h1>

      <div class="contact-card mx-auto p-4">
        <form id="valentineForm">
          <!-- User's Email -->
          <div class="mb-3">
            <label for="yourEmail" class="form-label">Your Email:</label>
            <input
              type="email"
              class="form-control"
              id="yourEmail"
              placeholder="Enter your email"
              required
            />
          </div>

          <!-- Recipient's Name -->
          <div class="mb-3">
            <label for="recipientName" class="form-label">Their Name:</label>
            <input
              type="text"
              class="form-control"
              id="recipientName"
              placeholder="Enter their name"
              required
            />
          </div>

          <!-- Recipient's Email -->
          <div class="mb-3">
            <label for="recipientEmail" class="form-label">Their Email:</label>
            <input
              type="email"
              class="form-control"
              id="recipientEmail"
              placeholder="Enter their email"
              required
            />
          </div>

          <!-- Valentine Choice -->
          <div class="mb-3">
            <label class="form-label">Do you want to be their Valentine?</label>
            <select id="valentineChoice" class="form-select" required>
              <option value="Yes">Yes! ❤️</option>
              <option value="No">No, sorry 😢</option>
            </select>
          </div>

          <button type="submit" class="btn btn-danger">
            Send Invitation 📩
          </button>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="mt-5">
      <div class="footer-container">
        <ul
          class="footer-links list-unstyled d-flex justify-content-center gap-3"
        >
          <li class="nav-item">
            <a href="index.html" class="nav-link">Home</a>
          </li>
          <li class="nav-item">
            <a href="testament.html" class="nav-link">Keepsake</a>
          </li>
          <li class="nav-item">
            <a href="reasons.html" class="nav-link">Reasons</a>
          </li>
          <li class="nav-item">
            <a href="vouchers.html" class="nav-link">Vouchers</a>
          </li>
          <li class="nav-item">
            <a href="contact.html" class="nav-link">Contact</a>
          </li>
        </ul>
        <p id="currentDate">❤️</p>
        <p id="dateTime">❤️</p>
      </div>
    </footer>

    <!-- JavaScript File -->
    <script src="contact.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
